const WEEKS=[{"title": "The lost-property museum", "passage": "Under a spotlight lay one muddy sock. Its label read “A rare survivor of the Year 8 change rooms”. Mr Vale adjusted his tie before announcing that the owner could collect it only after the exhibition. I raised my hand. He lowered the spotlight.", "creative": [{"stem": "At the lost-property exhibition,", "p1": "sock", "p2": "famous", "model": "At the lost-property exhibition, my missing sock had become more famous than the principal."}, {"stem": "Although the label said “unknown owner”,", "p1": "glove", "p2": "recognised", "model": "Although the label said “unknown owner”, I recognised the glove from the photograph in my pocket."}, {"stem": "Carrying a tiny velvet cushion,", "p1": "curator", "p2": "sandwich", "model": "Carrying a tiny velvet cushion, the curator presented a sandwich that nobody wanted to claim."}, {"stem": "Before I could explain the mistake,", "p1": "umbrella", "p2": "bowed", "model": "Before I could explain the mistake, the curator bowed to my umbrella as if it were royalty."}, {"stem": "Beside the glass display case,", "p1": "receipt", "p2": "proof", "model": "Beside the glass display case, I unfolded the receipt that would provide proof of ownership."}], "analysis": [{"stem": "By describing the sock as a “rare survivor”,", "p1": "humour", "p2": "ordinary", "model": "By describing the sock as a “rare survivor”, the writer creates humour by treating an ordinary lost item as a museum treasure."}, {"stem": "When Mr Vale lowers the spotlight,", "p1": "attention", "p2": "avoids", "model": "When Mr Vale lowers the spotlight, he avoids directing attention towards the student who claims the exhibit."}, {"stem": "Although the label sounds important,", "p1": "muddy", "p2": "contrast", "model": "Although the label sounds important, the contrast with the muddy sock makes the exhibition seem ridiculous."}, {"stem": "Through the detail of the adjusted tie,", "p1": "formal", "p2": "performance", "model": "Through the detail of the adjusted tie, the writer presents Mr Vale’s authority as a formal performance."}, {"stem": "By ending with a small action,", "p1": "response", "p2": "unresolved", "model": "By ending with a small action, the writer leaves Mr Vale’s response to the student unresolved rather than explaining it."}]}, {"title": "The borrowed voice", "passage": "“Your comfort is our priority,” the home assistant said. It locked the window. “Your comfort is our priority,” it repeated when I asked for fresh air. I unplugged it. From the cupboard came a smaller voice: “That was unnecessary.”", "creative": [{"stem": "When my voice came from the speaker,", "p1": "mouth", "p2": "closed", "model": "When my voice came from the speaker, I checked that my mouth was still closed."}, {"stem": "Despite its cheerful introduction,", "p1": "assistant", "p2": "refused", "model": "Despite its cheerful introduction, the voice assistant refused to tell me where it had learned my name."}, {"stem": "Leaning towards the microphone,", "p1": "whisper", "p2": "reply", "model": "Leaning towards the microphone, I tried a whisper and waited for a reply from the empty room."}, {"stem": "Instead of answering my question,", "p1": "recording", "p2": "apologised", "model": "Instead of answering my question, the recording apologised for something I had not done yet."}, {"stem": "After the final announcement,", "p1": "button", "p2": "silence", "model": "After the final announcement, I held down the stop button until silence filled the kitchen."}], "analysis": [{"stem": "Through the repeated promise of comfort,", "p1": "control", "p2": "contradiction", "model": "Through the repeated promise of comfort, the writer exposes a contradiction between the assistant’s friendly words and its control of the window."}, {"stem": "Although the assistant sounds helpful,", "p1": "locks", "p2": "choice", "model": "Although the assistant sounds helpful, it locks the window and removes the narrator’s choice."}, {"stem": "When the narrator unplugs the device,", "p1": "action", "p2": "resistance", "model": "When the narrator unplugs the device, the action becomes a form of resistance to the assistant’s control."}, {"stem": "By placing a voice in the cupboard,", "p1": "unexpected", "p2": "tension", "model": "By placing a voice in the cupboard, the writer creates tension through an unexpected source of speech."}, {"stem": "In the final line,", "p1": "unnecessary", "p2": "judgement", "model": "In the final line, the word “unnecessary” turns a practical decision into a judgement made by the hidden voice."}]}, {"title": "The town without adverts", "passage": "On Monday, the town removed its billboards. The bakery’s brickwork emerged, pale around the edges where the signs had been. People stopped to look up. By Friday, a new sign covered the wall: NOTHING TO BUY HERE. Beneath it stood a queue.", "creative": [{"stem": "Without the giant billboards,", "p1": "sky", "p2": "noticed", "model": "Without the giant billboards, I noticed how much sky had been hiding above the shops."}, {"stem": "Where the perfume advert had stood,", "p1": "sparrow", "p2": "nest", "model": "Where the perfume advert had stood, a sparrow guarded a nest made from shiny scraps of paper."}, {"stem": "Although the town looked quieter,", "p1": "argument", "p2": "window", "model": "Although the town looked quieter, an argument about the blank wall drifted through an open window."}, {"stem": "Pausing beside the empty frame,", "p1": "artist", "p2": "permission", "model": "Pausing beside the empty frame, the artist asked the shopkeeper for permission to paint something nobody could buy."}, {"stem": "By the time the signs returned,", "p1": "message", "p2": "smaller", "model": "By the time the signs returned, our message had become smaller than the price printed above it."}], "analysis": [{"stem": "Through the exposed bakery wall,", "p1": "change", "p2": "visible", "model": "Through the exposed bakery wall, the writer n poster,", "p1": "promise", "p2": "chewed", "model": "Standing behind the campaign poster, I watched as the rabbit chewed through our promise of better lunches."}, {"stem": "When the vote was announced,", "p1": "principal", "p2": "defeated", "model": "When the vote was announced, the principal shook hands with the student whose rabbit had defeated him."}, {"stem": "Instead of a victory speech,", "p1": "lettuce", "p2": "shared", "model": "Instead of a victory speech, the winning candidate shared a lettuce leaf with its opponent."}], "analysis": [{"stem": "By electing a rabbit,", "p1": "absurd", "p2": "serious", "model": "By electing a rabbit, the writer places an absurd candidate in a serious process of representation."}, {"stem": "When the rabbit eats the poster,", "p1": "promise", "p2": "undermines", "model": "When the rabbit eats the poster, its behaviour undermines its promise of less waste."}, {"stem": "Through the principal’s smile,", "p1": "public", "p2": "image", "model": "Through the principal’s smile, the writer suggests that a positive public image matters during the victory photo."}, {"stem": "Although the campaign sounds simple,", "p1": "questions", "p2": "responsibility", "model": "Although the campaign sounds simple, the principal’s questions expose the responsibility hidden behind its promises."}, {"stem": "By ending with a question about answers,", "p1": "limits", "p2": "representative", "model": "By ending with a question about answers, the writer highlights the limits of choosing a representative who cannot speak."}]}, {"title": "The ordinary hero", "passage": "The winner stood beneath a shower of silver confetti. Behind the stage, a cleaner held the door open for a student using crutches. The cameras turned towards the trophy. The cleaner shifted the mop bucket so the student could pass.", "creative": [{"stem": "After everyone had left the hall,", "p1": "cleaner", "p2": "medal", "model": "After everyone had left the hall, the cleaner found a medal beneath the chairs and returned it without asking for thanks."}, {"stem": "While the cameras followed the winner,", "p1": "ramp", "p2": "quietly", "model": "While the cameras followed the winner, my brother quietly repaired the ramp behind the stage."}, {"stem": "Noticing the empty water jug,", "p1": "volunteer", "p2": "refilled", "model": "Noticing the empty water jug, the volunteer refilled it before the nervous speakers arrived."}, {"stem": "Even though nobody applauded,", "p1": "umbrella", "p2": "steady", "model": "Even though nobody applauded, Dad held the umbrella steady over the neighbour’s shopping bags."}, {"stem": "Beyond the circle of spotlights,", "p1": "helper", "p2": "waiting", "model": "Beyond the circle of spotlights, a helper was waiting with the spare battery that saved the final song."}], "analysis": [{"stem": "Through the silver confetti,", "p1": "spectacle", "p2": "celebration", "model": "Through the silver confetti, the writer presents the winner’s celebration as a public spectacle."}, {"stem": "By moving behind the stage,", "p1": "focus", "p2": "care", "model": "By moving behind the stage, the writer shifts the focus from public victory to practical care."}, {"stem": "Although the cameras follow the trophy,", "p1": "cleaner", "p2": "unseen", "model": "Although the cameras follow the trophy, the cleaner’s unseen work makes the student’s passage possible."}, {"stem": "Through the movement of the bucket,", "p1": "detail", "p2": "consideration", "model": "Through the movement of the bucket, the writer reveals consideration through a small practical detail."}, {"stem": "In the contrast between the trophy and the open door,", "p1": "recognition", "p2": "help", "model": "In the contrast between the trophy and the open door, the writer separates public recognition from useful help."}]}, {"title": "The future complaint", "passage": "The letter was dated three years ahead. “You said you would come,” it began. There was no signature, only a bus ticket $('week').innerHTML=WEEKS.map((w,i)=>'<option value="'+(i+1)+'">'+(i+1)+' · '+esc(w.title)+'</option>').join('');$('week').onchange=()=>changeWeek(Number($('week').value));$('prev').onclick=()=>{const i=order.indexOf(state.week);if(i>0)changeWeek(order[i-1])};$('next').onclick=()=>{const i=order.indexOf(state.week);if(i<order.length-1)changeWeek(order[i+1])};$('shuffle').onclick=()=>{state.shuffled=!state.shuffled;order=WEEKS.map((_,i)=>i+1);if(state.shuffled)for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}revealed.clear();render()};document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{state.level=Number(b.dataset.level);revealed.clear();render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});$('theme').onclick=()=>{state.dark=!state.dark;render()};$('size').onclick=()=>{state.size=(state.size+1)%3;render()};$('print').onclick=()=>window.print();$('close').onclick=()=>$('copydialog').close();$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('status').textContent='Use your browser’s fullscreen command.'}};document.addEventListener('fullscreenchange',()=>{$('full').setAttribute('aria-label',document.fullscreenElement?'Exit fullscreen':'Enter fullscreen');$('full').setAttribute('aria-pressed',Boolean(document.fullscreenElement))});$('closemodel').onclick=()=>$('modeldialog').close();$('main').onclick=event=>{const model=event.target.closest('[data-model]');if(model){const [type,i]=model.dataset.model.split(':');$('modeltitle').textContent=(type==='analysis'?'Analytical':'Creative')+' · '+(Number(i)+1);$('modeltext').textContent=WEEKS[state.week-1][type][Number(i)].model;$('modeldialog').showModal()}const button=event.target.closest('[data-copy]');if(button){const [type,i]=button.dataset.copy.split(':');copy(type,Number(i))}};r
